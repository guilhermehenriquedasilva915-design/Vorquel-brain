[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vorquel-n8n-ingest"
version = "0.1.0"
description = "Human-gated planner and ingestor for Vorquel n8n knowledge."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
vorquel-n8n-plan = "vorquel_n8n_ingest.cli_plan:main"
vorquel-n8n-ingest = "vorquel_n8n_ingest.cli_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

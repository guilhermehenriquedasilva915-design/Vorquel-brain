[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorquel-n8n-brain-retrieval"
version = "0.1.0"
description = "Scope-enforced unified retrieval over Vorquel knowledge and n8n structural memory"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
vorquel-brain-retrieve = "vorquel_n8n_brain_retrieval.cli:main"
vorquel-brain-doctor = "vorquel_n8n_brain_retrieval.doctor_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

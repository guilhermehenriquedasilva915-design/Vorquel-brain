[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vorquel-brain-retrieval"
version = "0.1.0"
description = "Brain V1 read path: entity resolution, state, delta, evidence search and the deterministic ContextPack."
requires-python = ">=3.11"
# The contract is the only dependency, and it is a hard one on purpose: this
# package defines no vocabulary of its own. It is installed from
# ../brain-contract in CI, which also proves the two are separable.
dependencies = [
  "vorquel-brain-contract",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "jsonschema>=4.21,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

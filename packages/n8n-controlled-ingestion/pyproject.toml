[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vorquel-n8n-controlled-ingestion"
version = "0.1.0"
description = "Controlled manifest-gated ingestion for strict-safe n8n knowledge items."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
vorquel-n8n-plan-ingestion = "vorquel_n8n_controlled_ingestion.cli_plan:main"
vorquel-n8n-ingest-manifest = "vorquel_n8n_controlled_ingestion.cli_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

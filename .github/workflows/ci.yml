name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  n8n-analyzer-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-analyzer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-analyzer/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  n8n-analyzer-real-corpus:
    runs-on: ubuntu-latest
    needs: n8n-analyzer-quality
    defaults:
      run:
        working-directory: packages/n8n-analyzer
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-analyzer/pyproject.toml
      - name: Install analyzer
        run: python -m pip install -e .
      - name: Fetch pinned untrusted corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Static scan only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          vorquel-n8n-analyze "$CORPUS_DIR/workflows"             --output reports/justincache.json
      - name: Assert known dangerous patterns remain detected
        run: python scripts/check_corpus_report.py reports/justincache.json
      - name: Publish corpus summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("reports/justincache.json").read_text(encoding="utf-8")
          )
          summary = payload["summary"]

          print("## JustInCache/n8n-workflows — static corpus gate")
          print()
          print(f"Pinned SHA: `{__import__('os').environ['JUSTINCACHE_SHA']}`")
          print()
          print(f"- JSON files analyzed: **{summary['files_analyzed']}**")
          print(f"- Risk decisions: `{summary['risk_decisions']}`")
          print(f"- Max severities: `{summary['max_severities']}`")
          print(f"- Finding rules: `{summary['finding_rules']}`")
          print()
          print(
              "No workflow, command, SSH instruction, HTTP request, "
              "or embedded code from the corpus was executed."
          )
          PY


  n8n-knowledge-compiler-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-knowledge-compiler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-knowledge-compiler/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  n8n-knowledge-compiler-real-blocked-fixture:
    runs-on: ubuntu-latest
    needs:
      - n8n-analyzer-quality
      - n8n-knowledge-compiler-quality
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
      FIXTURE_PATH: workflows/Splitout/1169_Splitout_Code_Import_Webhook.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
      - name: Fetch pinned blocked fixture
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Analyze blocked fixture without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vorquel"
          vorquel-n8n-analyze "$CORPUS_DIR/$FIXTURE_PATH"             --output "$RUNNER_TEMP/vorquel/analysis.json"
      - name: Compile blocked fixture
        shell: bash
        run: |
          set -euo pipefail
          vorquel-n8n-compile "$CORPUS_DIR/$FIXTURE_PATH"             --analysis "$RUNNER_TEMP/vorquel/analysis.json"             --source-repo "JustInCache/n8n-workflows"             --source-commit "$JUSTINCACHE_SHA"             --source-path "$FIXTURE_PATH"             --output "$RUNNER_TEMP/vorquel/knowledge.json"
      - name: Assert security-only output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "knowledge.json")
              .read_text(encoding="utf-8")
          )
          serialized = json.dumps(payload)

          assert payload["admission"]["knowledge_role"] == "SECURITY_EXAMPLE"
          assert payload["admission"]["learning_scope"] == "security_only"
          assert payload["admission"]["implementation_reference_allowed"] is False
          assert payload["admission"]["vorquel_validated"] is False
          assert "--decrypted" not in serialized
          assert "export:credentials" not in serialized
          assert all(
              item["content_persisted"] is False
              for item in payload["executable_snippets_untrusted"]
          )
          PY


  n8n-knowledge-compiler-real-corpus-eval:
    runs-on: ubuntu-latest
    needs:
      - n8n-analyzer-quality
      - n8n-knowledge-compiler-quality
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
      - name: Fetch pinned untrusted corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Analyze real corpus without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vorquel"
          vorquel-n8n-analyze "$CORPUS_DIR/workflows"             --output "$RUNNER_TEMP/vorquel/analysis.json"
      - name: Run 24-workflow stratified compiler eval
        shell: bash
        run: |
          set -euo pipefail
          python packages/n8n-knowledge-compiler/scripts/eval_real_corpus.py             --corpus-dir "$CORPUS_DIR"             --analysis "$RUNNER_TEMP/vorquel/analysis.json"             --source-repo "JustInCache/n8n-workflows"             --source-commit "$JUSTINCACHE_SHA"             > "$RUNNER_TEMP/vorquel/eval-summary.json"
      - name: Publish safe eval summary
        shell: bash
        run: |
          cat "$RUNNER_TEMP/vorquel/eval-summary.json" >> "$GITHUB_STEP_SUMMARY"


  n8n-knowledge-store-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap Supabase-compatible roles
        run: psql -f supabase/tests/bootstrap.sql
      - name: Apply knowledge store migrations
        run: |
          psql -f supabase/migrations/20260918_001_n8n_brain_knowledge_store_v01.sql
          psql -f supabase/migrations/20260918_002_n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/simulate_supabase_createrole_membership.sql
          psql -f supabase/migrations/20260918_003_n8n_brain_writer_postgres_membership_v01.sql
          psql -f supabase/migrations/20260920_004_n8n_brain_experience_and_runs_v01.sql
      - name: Validate security and invariants
        run: |
          psql -f supabase/tests/n8n_brain_knowledge_store_v01.sql
          psql -f supabase/tests/n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/n8n_brain_experience_and_runs_v01.sql



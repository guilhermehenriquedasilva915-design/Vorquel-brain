name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  n8n-analyzer-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-analyzer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-analyzer/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  n8n-analyzer-real-corpus:
    runs-on: ubuntu-latest
    needs: n8n-analyzer-quality
    defaults:
      run:
        working-directory: packages/n8n-analyzer
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-analyzer/pyproject.toml
      - name: Install analyzer
        run: python -m pip install -e .
      - name: Fetch pinned untrusted corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Static scan only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          vorquel-n8n-analyze "$CORPUS_DIR/workflows"             --output reports/justincache.json
      - name: Assert known dangerous patterns remain detected
        run: python scripts/check_corpus_report.py reports/justincache.json
      - name: Publish corpus summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("reports/justincache.json").read_text(encoding="utf-8")
          )
          summary = payload["summary"]

          print("## JustInCache/n8n-workflows — static corpus gate")
          print()
          print(f"Pinned SHA: `{__import__('os').environ['JUSTINCACHE_SHA']}`")
          print()
          print(f"- JSON files analyzed: **{summary['files_analyzed']}**")
          print(f"- Risk decisions: `{summary['risk_decisions']}`")
          print(f"- Max severities: `{summary['max_severities']}`")
          print(f"- Finding rules: `{summary['finding_rules']}`")
          print()
          print(
              "No workflow, command, SSH instruction, HTTP request, "
              "or embedded code from the corpus was executed."
          )
          PY


  n8n-knowledge-compiler-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-knowledge-compiler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-knowledge-compiler/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  n8n-knowledge-compiler-real-blocked-fixture:
    runs-on: ubuntu-latest
    needs:
      - n8n-analyzer-quality
      - n8n-knowledge-compiler-quality
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
      FIXTURE_PATH: workflows/Splitout/1169_Splitout_Code_Import_Webhook.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
      - name: Fetch pinned blocked fixture
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Analyze blocked fixture without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vorquel"
          vorquel-n8n-analyze "$CORPUS_DIR/$FIXTURE_PATH"             --output "$RUNNER_TEMP/vorquel/analysis.json"
      - name: Compile blocked fixture
        shell: bash
        run: |
          set -euo pipefail
          vorquel-n8n-compile "$CORPUS_DIR/$FIXTURE_PATH"             --analysis "$RUNNER_TEMP/vorquel/analysis.json"             --source-repo "JustInCache/n8n-workflows"             --source-commit "$JUSTINCACHE_SHA"             --source-path "$FIXTURE_PATH"             --output "$RUNNER_TEMP/vorquel/knowledge.json"
      - name: Assert security-only output
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "knowledge.json")
              .read_text(encoding="utf-8")
          )
          serialized = json.dumps(payload)

          assert payload["admission"]["knowledge_role"] == "SECURITY_EXAMPLE"
          assert payload["admission"]["learning_scope"] == "security_only"
          assert payload["admission"]["implementation_reference_allowed"] is False
          assert payload["admission"]["vorquel_validated"] is False
          assert "--decrypted" not in serialized
          assert "export:credentials" not in serialized
          assert all(
              item["content_persisted"] is False
              for item in payload["executable_snippets_untrusted"]
          )
          PY


  n8n-knowledge-compiler-real-corpus-eval:
    runs-on: ubuntu-latest
    needs:
      - n8n-analyzer-quality
      - n8n-knowledge-compiler-quality
    env:
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
      - name: Fetch pinned untrusted corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          actual="$(git -C "$corpus" rev-parse HEAD)"
          test "$actual" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Analyze real corpus without execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vorquel"
          vorquel-n8n-analyze "$CORPUS_DIR/workflows"             --output "$RUNNER_TEMP/vorquel/analysis.json"
      - name: Run 24-workflow stratified compiler eval
        shell: bash
        run: |
          set -euo pipefail
          python packages/n8n-knowledge-compiler/scripts/eval_real_corpus.py             --corpus-dir "$CORPUS_DIR"             --analysis "$RUNNER_TEMP/vorquel/analysis.json"             --source-repo "JustInCache/n8n-workflows"             --source-commit "$JUSTINCACHE_SHA"             > "$RUNNER_TEMP/vorquel/eval-summary.json"
      - name: Publish safe eval summary
        shell: bash
        run: |
          cat "$RUNNER_TEMP/vorquel/eval-summary.json" >> "$GITHUB_STEP_SUMMARY"


  n8n-knowledge-store-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap Supabase-compatible roles
        run: psql -f supabase/tests/bootstrap.sql
      - name: Apply knowledge store migrations
        run: |
          psql -f supabase/migrations/20260918_001_n8n_brain_knowledge_store_v01.sql
          psql -f supabase/migrations/20260918_002_n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/simulate_supabase_createrole_membership.sql
          psql -f supabase/migrations/20260918_003_n8n_brain_writer_postgres_membership_v01.sql
          psql -f supabase/migrations/20260920_004_n8n_brain_experience_and_runs_v01.sql
          psql -f supabase/migrations/20260920_005_fix_touch_build_run_search_path.sql
      - name: Seed legacy-scoped rows under the pre-migration constraint
        # Written while the four-value CHECK is still in force, so the next step
        # has real rows to preserve. Backward compatibility is proven here or
        # not at all: asserting it after the fact proves nothing.
        run: psql -f supabase/tests/brain_scope_legacy_seed.sql
      - name: Apply the Brain V1 scope migration
        run: psql -f supabase/migrations/20260922_006_brain_scope_vertical_entity_v01.sql
      - name: Re-apply it, to prove it is idempotent
        run: psql -f supabase/migrations/20260922_006_brain_scope_vertical_entity_v01.sql
      - name: Legacy rows survived and all six scopes are accepted
        run: psql -f supabase/tests/brain_scope_vertical_entity_v01.sql
      - name: Validate security and invariants
        run: |
          psql -f supabase/tests/n8n_brain_knowledge_store_v01.sql
          psql -f supabase/tests/n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/n8n_brain_experience_and_runs_v01.sql


  n8n-knowledge-writer-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      N8N_BRAIN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: packages/n8n-knowledge-writer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-knowledge-writer/pyproject.toml
      - name: Bootstrap Supabase-compatible roles
        working-directory: .
        run: psql -f supabase/tests/bootstrap.sql
      - name: Apply knowledge store migrations
        working-directory: .
        run: |
          psql -f supabase/migrations/20260918_001_n8n_brain_knowledge_store_v01.sql
          psql -f supabase/migrations/20260918_002_n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/simulate_supabase_createrole_membership.sql
          psql -f supabase/migrations/20260918_003_n8n_brain_writer_postgres_membership_v01.sql
      - name: Validate writer database role
        working-directory: .
        run: psql -f supabase/tests/n8n_brain_writer_role_v01.sql
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest


  n8n-controlled-ingestion-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      N8N_BRAIN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JUSTINCACHE_REPO: https://github.com/JustInCache/n8n-workflows.git
      JUSTINCACHE_SHA: 5a7864987c22930521382b597873b713cc830dac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bootstrap Supabase-compatible roles
        run: psql -f supabase/tests/bootstrap.sql
      - name: Apply n8n Brain migrations
        run: |
          psql -f supabase/migrations/20260918_001_n8n_brain_knowledge_store_v01.sql
          psql -f supabase/migrations/20260918_002_n8n_brain_writer_role_v01.sql
          psql -f supabase/tests/simulate_supabase_createrole_membership.sql
          psql -f supabase/migrations/20260918_003_n8n_brain_writer_postgres_membership_v01.sql
      - name: Install local n8n Brain packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
          python -m pip install -e packages/n8n-knowledge-writer
          python -m pip install -e 'packages/n8n-controlled-ingestion[dev]'
      - name: Ruff
        run: ruff check packages/n8n-controlled-ingestion
      - name: Unit and integration tests
        run: pytest packages/n8n-controlled-ingestion
      - name: Reset disposable rows after integration tests
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -c             "truncate table n8n_brain.knowledge_items, n8n_brain.workflow_analyses, n8n_brain.source_snapshots restart identity cascade"
      - name: Fetch pinned untrusted corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/justincache-n8n-workflows"
          git init "$corpus"
          git -C "$corpus" remote add origin "$JUSTINCACHE_REPO"
          git -C "$corpus" -c protocol.version=2 fetch             --depth=1 --no-tags --no-recurse-submodules origin "$JUSTINCACHE_SHA"
          git -C "$corpus" checkout --detach FETCH_HEAD
          test "$(git -C "$corpus" rev-parse HEAD)" = "$JUSTINCACHE_SHA"
          echo "CORPUS_DIR=$corpus" >> "$GITHUB_ENV"
      - name: Profile controlled-ingestion eligibility
        shell: bash
        run: |
          python packages/n8n-controlled-ingestion/scripts/profile_real_corpus.py \
            "$CORPUS_DIR/workflows" \
            --source-repo "JustInCache/n8n-workflows" \
            --source-commit "$JUSTINCACHE_SHA"
      - name: Plan four controlled-structure workflows from real corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vorquel"
          vorquel-n8n-plan-ingestion "$CORPUS_DIR/workflows"             --source-repo "JustInCache/n8n-workflows"             --source-commit "$JUSTINCACHE_SHA"             --analyzer-version "0.1.0"             --max-items 4             --output "$RUNNER_TEMP/vorquel/manifest.json"             > "$RUNNER_TEMP/vorquel/plan-summary.json"
      - name: Assert manifest is controlled and exactly four
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "manifest.json")
              .read_text(encoding="utf-8")
          )
          assert manifest["selection_profile"] == "CONTROLLED_STRUCTURE_V0_1"
          assert len(manifest["items"]) == 4
          assert len({item["source_path"] for item in manifest["items"]}) == 4
          assert all(item["risk_decision"] == "SAFE_FOR_LEARNING" for item in manifest["items"])
          assert all(
              item["knowledge_role"] in {"REFERENCE_PATTERN", "STRUCTURE_REFERENCE_RESTRICTED"}
              for item in manifest["items"]
          )
          assert all(item["node_count"] > 0 for item in manifest["items"])
          PY
      - name: Print safe manifest review metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "manifest.json")
              .read_text(encoding="utf-8")
          )
          for item in manifest["items"]:
              print(
                  json.dumps(
                      {
                          "source_path": item["source_path"],
                          "sha256": item["sha256"],
                          "risk_decision": item["risk_decision"],
                          "knowledge_role": item["knowledge_role"],
                          "node_count": item["node_count"],
                          "untrusted_text_count": item["untrusted_text_count"],
                          "finding_rules": item["finding_rules"],
                      },
                      sort_keys=True,
                  )
              )
          PY
      - name: Dry-run real corpus manifest
        shell: bash
        run: |
          set -euo pipefail
          vorquel-n8n-ingest-manifest             "$CORPUS_DIR/workflows"             "$RUNNER_TEMP/vorquel/manifest.json"             > "$RUNNER_TEMP/vorquel/dry-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "dry-run.json")
              .read_text(encoding="utf-8")
          )
          assert result["status"] == "VALIDATED"
          assert result["dry_run"] is True
          assert result["item_count"] == 4
          PY
      - name: Persist manifest to disposable PostgreSQL
        shell: bash
        env:
          N8N_BRAIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          vorquel-n8n-ingest-manifest             "$CORPUS_DIR/workflows"             "$RUNNER_TEMP/vorquel/manifest.json"             --persist             > "$RUNNER_TEMP/vorquel/persist-1.json"
          vorquel-n8n-ingest-manifest             "$CORPUS_DIR/workflows"             "$RUNNER_TEMP/vorquel/manifest.json"             --persist             > "$RUNNER_TEMP/vorquel/persist-2.json"
      - name: Assert idempotency and no extra persistence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "vorquel")
          first = json.loads((root / "persist-1.json").read_text(encoding="utf-8"))
          second = json.loads((root / "persist-2.json").read_text(encoding="utf-8"))
          assert first["item_count"] == second["item_count"] == 4
          assert all(item["created"]["knowledge"] for item in first["items"])
          assert all(not item["created"]["knowledge"] for item in second["items"])
          PY
          test "$(psql -Atqc 'select count(*) from n8n_brain.source_snapshots')" = "4"
          test "$(psql -Atqc 'select count(*) from n8n_brain.workflow_analyses')" = "4"
          test "$(psql -Atqc 'select count(*) from n8n_brain.knowledge_items')" = "4"
      - name: Publish safe ingestion summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(os.environ["RUNNER_TEMP"], "vorquel", "manifest.json")
              .read_text(encoding="utf-8")
          )
          print("## Controlled n8n real-corpus ingestion gate")
          print()
          print(f"Pinned SHA: `{manifest['source_commit']}`")
          print()
          print("- controlled-structure manifest items: **4**")
          print("- dry-run before persistence: **passed**")
          print("- disposable PostgreSQL persistence: **passed**")
          print("- second run idempotency: **passed**")
          print("- persisted rows: **4 sources / 4 analyses / 4 knowledge items**")
          print("- external workflow/code/shell/SSH/HTTP execution: **none**")
          print()
          print("Selected review metadata:")
          for item in manifest["items"]:
              print(
                  f"- `{item['source_path']}` | "
                  f"sha256=`{item['sha256']}` | "
                  f"role=`{item['knowledge_role']}` | "
                  f"findings=`{item['finding_rules']}` | "
                  f"untrusted_text_count={item['untrusted_text_count']}"
              )
          PY


  n8n-brain-retrieval-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-brain-retrieval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-brain-retrieval/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Doctor reports BLOCKED without an n8n instance
        working-directory: .
        run: |
          set -euo pipefail
          # No n8n and no database are configured on the runner, so the honest
          # answer is BLOCKED. A doctor that returned READY here would be lying.
          if vorquel-brain-doctor --json > doctor.json; then
            echo "doctor unexpectedly reported a usable Brain"
            cat doctor.json
            exit 1
          fi
          python -c "import json,sys; d=json.load(open('doctor.json')); sys.exit(0 if d['overall']=='BLOCKED' else 1)"


  n8n-brain-learn-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-brain-learn/pyproject.toml
      - name: Install local n8n Brain packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
          python -m pip install -e packages/n8n-brain-retrieval
          python -m pip install -e 'packages/n8n-brain-learn[dev]'
      - name: Ruff
        run: ruff check packages/n8n-brain-learn
      - name: Tests
        run: pytest packages/n8n-brain-learn
      - name: No test may be silently skipped away
        shell: bash
        run: |
          set -euo pipefail
          # The repo guard tests include a symlink case that cannot run on
          # Windows. On this runner it must actually execute, or the guard is
          # unproven while still looking green.
          pytest packages/n8n-brain-learn/tests/test_repo_adapter.py -q --no-header \
            | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "repo guard tests were skipped on a platform that supports them"
            exit 1
          fi

  # LEARN writes through the Vorquel Watch knowledge RPCs. The SQL-level proof
  # of scope isolation and the review gate lives in that repository's
  # knowledge-migrations job; what this job proves is that a batch produced here
  # refuses to persist without a store, and never leaks a DSN when it fails.
  n8n-brain-learn-fails-closed:
    runs-on: ubuntu-latest
    needs: n8n-brain-learn-quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local n8n Brain packages
        run: |
          python -m pip install -e packages/n8n-analyzer
          python -m pip install -e packages/n8n-knowledge-compiler
          python -m pip install -e packages/n8n-brain-retrieval
          python -m pip install -e 'packages/n8n-brain-learn[dev]'
      - name: A dry run needs no database and approves nothing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'O no HTTP Request precisa de retryOnFail com maxTries limitado,' \
            'porque um retry sem teto gira ate estourar a fila de execucao.' \
            > lesson.txt
          vorquel-brain-learn --scope CLIENT:acme \
            --classification CLIENT_CONFIDENTIAL \
            --message-file lesson.txt --json > batch.json
          python - <<'PY'
          import json
          from pathlib import Path

          batch = json.loads(Path("batch.json").read_text(encoding="utf-8"))
          assert batch["source"]["scope"] == "CLIENT:acme"
          assert batch["candidate_count"] >= 1
          # A dry run cannot have persisted or approved anything.
          assert "persisted" not in batch
          for candidate in batch["candidates"]:
              assert candidate["locator_kind"] == "MESSAGE"
              assert candidate["candidate_id"].startswith("knd_")
          PY
      - name: Persisting without a store fails closed
        shell: bash
        run: |
          set -euo pipefail
          if vorquel-brain-learn --scope GLOBAL_VORQUEL \
               --message-file lesson.txt --persist > out.txt 2> err.txt; then
            echo "LEARN persisted without a configured store"
            exit 1
          fi
          grep -q "VORQUEL_BRAIN_DATABASE_URL" err.txt

  n8n-build-guard-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-build-guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/n8n-build-guard/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Install analyzer so the parity tests actually run
        working-directory: .
        run: python -m pip install -e packages/n8n-analyzer
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Analyzer parity tests were not silently skipped
        run: |
          set -euo pipefail
          # The parity tests skip when the analyzer is absent. Installing it is
          # not enough — assert they ran, or drift between the two components
          # would pass CI as a skip.
          pytest tests/test_analyzer_parity.py -q --no-header -rs > parity.txt
          if grep -qi "skipped" parity.txt; then
            echo "analyzer parity tests skipped; drift would go undetected"
            cat parity.txt
            exit 1
          fi
      - name: The SAFE TEST gate refuses an empty evidence record
        run: |
          set -euo pipefail
          # The gate's core property, asserted outside pytest too: a caller who
          # recorded nothing must never be allowed to execute a workflow.
          python -c "
          from vorquel_n8n_build_guard import SafeTestEvidence, evaluate
          decision = evaluate(SafeTestEvidence())
          assert decision.may_execute is False, decision
          assert decision.failed_precondition == 'deterministic_validation', decision
          print('empty evidence refused at', decision.failed_precondition)
          "
      - name: An unexpected credential binding stops the run
        run: |
          set -euo pipefail
          # The DEV instance was provisioned with no credentials, so any binding
          # at all must produce STOP_AND_REVERT.
          python -c "
          from vorquel_n8n_build_guard import guard_credentials
          result = guard_credentials([{'node': 'Slack', 'id': 'cred-1', 'type': 'slackApi'}])
          assert result.clean is False, result
          assert result.required_action == 'STOP_AND_REVERT', result
          print('unexpected binding ->', result.required_action)
          "

  brain-retrieval-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brain-retrieval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/brain-retrieval/pyproject.toml
      - name: Install the contract, then the package that consumes it
        # Installed separately and in this order on purpose: it proves the
        # dependency direction is real and one-way. brain-retrieval consumes
        # brain-contract; nothing in the contract knows this package exists.
        run: |
          python -m pip install -e ../brain-contract
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: The fixture is reproducible from its generator
        # Regenerating must be a no-op. A fixture edited by hand would drift from
        # the script that documents what each object is for, and the evals would
        # slowly stop testing what they say they test.
        run: |
          set -euo pipefail
          cp fixtures/brain_v1_b.json /tmp/fixture-before.json
          python fixtures/build_fixture.py
          diff -u /tmp/fixture-before.json fixtures/brain_v1_b.json
      - name: Every fixture object validates against the published schemas
        run: |
          set -euo pipefail
          python -c "
          from vorquel_brain_retrieval import InMemoryBrainStore
          store = InMemoryBrainStore.from_json('fixtures/brain_v1_b.json')
          total = sum(len(store.all_of(t)) for t in (
              'Entity','Source','SourceFragment','Claim','Evidence',
              'Hypothesis','Unknown','Decision','Event','StateProjection'))
          assert total > 50, total
          print(total, 'objects loaded and schema-validated')
          "
      - name: Enum parity across Python, schemas and storage
        working-directory: .
        run: |
          set -euo pipefail
          # The Brain-V1-A scratch audit, made permanent. Compares the Python
          # vocabularies against the JSON schema enums, and against the CHECK
          # constraints in the migration SQL for the two columns storage
          # actually constrains.
          python -c "
          from vorquel_brain_retrieval.parity import assert_parity, parity_report
          import json
          assert_parity()
          print(json.dumps(parity_report(), indent=2, sort_keys=True))
          "
      - name: The ContextPack is byte-reproducible
        run: |
          set -euo pipefail
          python -c "
          import json
          from vorquel_brain_retrieval import InMemoryBrainStore, Scope, get_context_pack
          store = InMemoryBrainStore.from_json('fixtures/brain_v1_b.json')
          scope = Scope('ENTITY', 'chaves-hugo')
          args = dict(mode='AUDIT', token_budget=8000, entity_ids=('ent_chaves_hugo',))
          first = get_context_pack(store, 'reduzir tempo de resposta', scope, **args).pack
          second = get_context_pack(store, 'reduzir tempo de resposta', scope, **args).pack
          assert json.dumps(first, sort_keys=True) == json.dumps(second, sort_keys=True)
          print('context_pack_id', first['context_pack_id'])
          "
      - name: This package implements six reads and neither controlled write
        run: |
          set -euo pipefail
          # The mirror of the Brain-V1-A assertion that it implemented none of
          # the eight. Brain-V1-B implements the reads and stops there;
          # record_candidate and record_event are Brain-V1-C.
          python -c "
          import vorquel_brain_retrieval as pkg
          from vorquel_brain_contract import BRAIN_V1_CONTROLLED_WRITES, BRAIN_V1_READS
          assert set(pkg.IMPLEMENTED_READS) == set(BRAIN_V1_READS), pkg.IMPLEMENTED_READS
          for write in BRAIN_V1_CONTROLLED_WRITES:
              assert not hasattr(pkg, write), write
          assert not hasattr(pkg.BrainStore, 'write')
          print('6 reads implemented, 0 writes, storage port is read-only')
          "
      - name: No MCP server, vector database or graph database was introduced
        run: |
          set -euo pipefail
          # Brain-V1-B's out-of-bounds list, checked rather than promised.
          # src/ only: tests/ names these strings on purpose, in the test that
          # asserts the package does not contain them.
          ! grep -rnE --include='*.py' "mcp\.server|FastMCP|stdio_server|import (chromadb|qdrant|pinecone|neo4j|weaviate|pgvector)" src/


  brain-contract-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brain-contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/brain-contract/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Every schema parses and carries its own version
        run: |
          set -euo pipefail
          # Versioning is explicit in the payload, not inferred from the v1/
          # directory, so an object stays identifiable once it is copied or logged.
          python -c "
          from vorquel_brain_contract import V1_OBJECTS, schema_for, load_all_schemas
          assert len(V1_OBJECTS) == 12, V1_OBJECTS
          for object_type in V1_OBJECTS:
              schema = schema_for(object_type)
              assert 'contract_version' in schema['required'], object_type
              assert schema['additionalProperties'] is False, object_type
          print(len(load_all_schemas()), 'schemas parsed,', len(V1_OBJECTS), 'V1 objects')
          "
      - name: The contract is eight tools and none of them is implemented here
        run: |
          set -euo pipefail
          # DIV-1, asserted in CI as well as in pytest: Brain-V1-A defines the
          # interface and implements none of it.
          python -c "
          import vorquel_brain_contract as contract
          assert len(contract.BRAIN_V1_TOOLS) == 8, contract.BRAIN_V1_TOOLS
          assert 'get_entity' in contract.BRAIN_V1_READS
          for tool in contract.BRAIN_V1_TOOLS:
              assert not hasattr(contract, tool), tool
          print('8 tools declared, 0 implemented')
          "
      - name: SECRET never reaches a ContextPack
        run: |
          set -euo pipefail
          # The one rule with no exception at any token budget or in any mode.
          python -c "
          from vorquel_brain_contract import check_context_pack_excludes_secret
          pack = {'context_pack_id': 'P', 'sensitivity_level': 'INTERNAL', 'evidence_ids': ['E']}
          objects = {'E': {'sensitivity': {'sensitivity_level': 'SECRET'}}}
          violations = check_context_pack_excludes_secret(pack, objects)
          assert violations and violations[0].severity == 'CRITICAL', violations
          print('secret leak ->', violations[0].code, violations[0].severity)
          "
      - name: An absence of evidence is never a negative fact
        run: |
          set -euo pipefail
          # NO_EVIDENCE_FOUND != FALSE. Collapsing the two is how a gap in the
          # record becomes a claim about the world that nothing can undo later.
          python -c "
          from vorquel_brain_contract import check_no_evidence_not_false
          claim = {'claim_id': 'C', 'epistemic_status': 'DESCONHECIDO', 'object_value': False}
          violations = check_no_evidence_not_false(claim)
          assert violations and violations[0].severity == 'CRITICAL', violations
          print('absence-as-false ->', violations[0].code)
          "
      - name: No unreviewed migration appears
        run: |
          set -euo pipefail
          # Brain-V1-A shipped no migration and this step asserted the count was
          # five. Brain-V1-B added exactly one -- 20260922_006, the migration
          # DIV-3 deferred to it -- so the expected count is six.
          #
          # The gate is unchanged in force: a seventh file still fails here, and
          # the set is pinned by name in
          # tests/test_div_reconciliation.py::test_no_unreviewed_migration_appears
          # so a migration cannot land unreviewed by being renamed into the
          # count.
          cd "$GITHUB_WORKSPACE"
          count=$(find supabase/migrations -name '*.sql' | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "expected 6 migrations, found $count" >&2
            find supabase/migrations -name '*.sql' | sort >&2
            exit 1
          fi
          echo "migration count as reviewed: $count"

          cache-dependency-path: packages/n8n-knowledge-writer/pyproject.toml
      - name: Bootstrap Supabase-compatible roles
        working-directory: .
        run: psql -f supabase/tests/bootstrap.sql
      - name: Apply knowledge store migrations
